
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "securefile-vault"
version = "0.1.0"
description = "A secure local file encryption tool built with Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44",
]

[project.scripts]
securefile-vault = "securefile_vault.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
